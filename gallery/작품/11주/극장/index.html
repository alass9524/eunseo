  <style>
    @font-face {
      font-family: "INT";
      src: url("../../에디터/fonts/Inter-400.woff2") format("woff2");
      font-weight: 400;
      font-display: swap
    }

    @font-face {
      font-family: "INT";
      src: url("../../에디터/fonts/Inter-500.woff2") format("woff2");
      font-weight: 500;
      font-display: swap
    }

    @font-face {
      font-family: "INT";
      src: url("../../에디터/fonts/Inter-700.woff2") format("woff2");
      font-weight: 700;
      font-display: swap
    }

    @font-face {
      font-family: "PTD";
      src: url("../../에디터/fonts/PretendardVariable.woff2") format("woff2-variations"), url("../../에디터/fonts/PretendardVariable.woff2") format("woff2");
      font-weight: 45 930;
      font-display: swap
    }

    /* v2 — 첫 화면은 flim.ai식 분할 화면(포인트 컬러 패널 + 검은 원 + 큰 제목), 아래는 A24 시스템(따뜻한 흰 바탕 · 모서리 0 · 1px 선) */
    :root {
      --bg: #fcfbfa;
      --n50: #f2f0ed;
      --n100: #e8e6e2;
      --n200: #d6d4d1;
      --mute: #9c9791;
      --ink: #0e0e0d;
      --dk: #141414;
      --sans: "INT", "PTD", system-ui, sans-serif;
      --mono: "INT", "PTD", system-ui, sans-serif;
      --expo: cubic-bezier(.19, 1, .22, 1);
      --pad: clamp(16px, 2.2vw, 32px);
      --pt: #fcaa37;
      --pt-ink: #0e0e0d;
      color-scheme: light;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 400 17px/1.45 var(--sans);
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
      overflow-wrap: break-word;
      line-break: strict
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
      text-wrap: pretty
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer
    }

    a {
      color: inherit
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px
    }

    .mono {
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1;
      letter-spacing: .02em;
      text-transform: uppercase
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid currentColor;
      padding: 8px 10px 7px;
      font: 500 11px/1 var(--sans);
      text-transform: uppercase;
      letter-spacing: .02em;
      text-decoration: none;
      transition: background .25s, color .25s
    }

    .btn:hover {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    /* 머리 */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      height: 56px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 var(--pad);
      color: var(--ink);
      background: none;
      transition: color .4s
    }

    header.dark {
      color: #fff
    }

    header nav {
      display: flex;
      gap: clamp(12px, 1.7vw, 26px);
      white-space: nowrap
    }

    @media (max-width:1380px) {
      header nav {
        gap: 12px;
        font-size: 9px
      }

      header nav a::before {
        margin-right: 5px
      }
    }

    @media (max-width:1180px) {
      header nav {
        display: none
      }
    }

    header a {
      text-decoration: none
    }

    header nav a::before {
      content: "";
      display: inline-block;
      width: 0;
      height: 0;
      border-left: 6px solid currentColor;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      margin-right: 8px;
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity .2s, transform .2s
    }

    header nav a:hover::before,
    header nav a[aria-current="true"]::before {
      opacity: 1;
      transform: none
    }

    header .mark {
      font: 700 19px/1 var(--sans);
      letter-spacing: -.04em;
      white-space: nowrap
    }

    header .r {
      justify-self: end;
      display: flex;
      gap: 10px;
      align-items: center
    }

    header .r b {
      font: inherit;
      background: var(--ink);
      color: #fff;
      padding: 7px 9px 6px
    }

    header.dark .r b {
      background: #fff;
      color: #000
    }

    /* ── 첫 화면: 흰 패널이 걷히며 장면이 열린다 (스크롤 연동) ── */
    .hero {
      position: relative;
      height: 730vh;
      background: var(--bg)
    }

    .stick {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden
    }

    .htop {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 70vh;
      z-index: 10;
      background: var(--bg);
      padding-top: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      will-change: transform
    }

    .htxt {
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .hero.go .enjoy {
      opacity: 1
    }

    .hsm,
    .hbig {
      display: block;
      overflow: hidden;
      white-space: nowrap
    }

    .hsm {
      font: 500 clamp(18px, 2vw, 30px)/1.15 var(--sans);
      letter-spacing: -.01em;
      text-transform: uppercase
    }

    .hbig {
      font: 700 clamp(56px, 11.5vw, 200px)/.95 var(--sans);
      letter-spacing: -.045em;
      padding-bottom: .06em;
      text-transform: uppercase
    }

    .hsm i,
    .hbig i {
      display: inline-block;
      font-style: normal;
      transform: translateY(105%);
      transition: transform 1.1s var(--expo)
    }

    .hero.go .hsm i,
    .hero.go .hbig i {
      transform: none
    }

    .hsub {
      margin-top: clamp(14px, 1.6vw, 22px);
      font: 400 11px/1.7 var(--sans);
      letter-spacing: .04em;
      text-transform: uppercase
    }

    .hsub span {
      display: block;
      overflow: hidden
    }

    .hsub span i {
      display: block;
      font-style: normal;
      transform: translateY(250%) rotate(5deg);
      transform-origin: 0 50%;
      transition: transform 1.1s var(--expo)
    }

    .hero.go .hsub span i {
      transform: none
    }

    .enjoy {
      position: absolute;
      left: var(--pad);
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font: 500 11px/1 var(--sans);
      letter-spacing: .04em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 1s .8s
    }

    .enjoy b {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 1px solid currentColor;
      border-radius: 50%;
      position: relative
    }

    .enjoy b::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      margin: -2px;
      background: currentColor;
      border-radius: 50%;
      animation: dn 1.6s var(--expo) infinite
    }

    @keyframes dn {
      0% {
        transform: translateY(-4px);
        opacity: 0
      }

      40% {
        opacity: 1
      }

      100% {
        transform: translateY(5px);
        opacity: 0
      }
    }

    .hbot {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateY(10%);
      transition: opacity 2.8s var(--expo), transform 2.8s var(--expo)
    }

    .hero.go .hbot {
      opacity: 1;
      transform: none
    }

    .himgs {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transform-origin: 50% 100%;
      will-change: transform;
      transform: translate3d(0, 30%, 0) scale(1.25);
      background: #000
    }

    .hscene {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .9s var(--expo)
    }

    .hscene.on {
      opacity: 1
    }

    .hscene img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .hscene::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .42)
    }

    .hchips {
      position: absolute;
      left: 12.5vw;
      top: 34vh;
      z-index: 3;
      display: flex;
      gap: 1.2vw
    }

    .hchip {
      width: 15vw;
      aspect-ratio: .8;
      padding: 12px 12px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font: 500 11px/1.2 var(--sans);
      letter-spacing: .04em;
      text-transform: uppercase;
      will-change: transform;
      transform: translate3d(-130vw, 0, 0);
      cursor: pointer;
      text-align: left
    }

    .hchip b {
      font-weight: 700
    }

    .hchip span:last-child {
      font-size: 12px;
      letter-spacing: .02em
    }

    .hcap {
      position: absolute;
      left: calc(12.5vw + 4 * 15vw + 3 * 1.2vw + 2.4vw);
      top: 34vh;
      z-index: 3;
      color: #fff;
      font: 500 12px/1.4 var(--sans);
      letter-spacing: .02em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity .6s
    }

    .hcap b {
      display: block;
      font-weight: 700
    }

    .hnav {
      position: absolute;
      right: var(--pad);
      bottom: calc(var(--pad) * 1.4);
      z-index: 4;
      display: flex;
      gap: 14px;
      color: #fff;
      font: 500 11px/1 var(--sans);
      letter-spacing: .04em
    }

    .hnav button {
      opacity: .55;
      padding: 4px 0;
      border-bottom: 1px solid transparent;
      transition: opacity .25s
    }

    .hnav button:hover,
    .hnav button[aria-current="true"] {
      opacity: 1;
      border-color: #fff
    }

    .hq {
      position: absolute;
      left: var(--pad);
      bottom: calc(var(--pad) * 1.4);
      z-index: 3;
      color: #fff;
      max-width: min(40ch, 60%);
      font: 500 clamp(15px, 1.5vw, 22px)/1.3 var(--sans);
      text-transform: none
    }

    .hq small {
      display: block;
      margin-top: 4px;
      font: 400 clamp(12px, 1vw, 14px)/1.35 var(--sans);
      opacity: .8
    }

    .hero.static {
      height: auto
    }

    .hero.static .stick {
      position: relative;
      height: auto
    }

    .hero.static .htop {
      position: relative;
      height: auto;
      padding: 90px 0 60px
    }

    .hero.static .hbot {
      position: relative;
      height: 70vh;
      opacity: 1;
      transform: none
    }

    .hero.static
    /* 색인 */

    /* 영화 한 편 */
    .film {
      position: relative
    }

    .screen {
      position: relative;
      height: 100vh;
      min-height: 560px;
      overflow: hidden;
      background: #000;
      color: #fff
    }

    .screen img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.12);
      transition: transform 2.4s var(--expo), opacity 1s;
      opacity: 0
    }

    .film.in .screen img {
      transform: none;
      opacity: 1
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, .55), rgba(0, 0, 0, .15) 38%, transparent 52%, rgba(0, 0, 0, .5))
    }

    .screen .lab {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      top: 58px; /* 위 여백을 아래 여백(약 40px)에 맞춰 올림 */
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 14px
    }

    .screen .lab div {
      display: flex;
      gap: 14px
    }

    .screen h2 {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      top: 80px;
      z-index: 2;
      font: 500 clamp(56px, 11vw, 190px)/.9 var(--sans);
      letter-spacing: -.045em;
      text-shadow: 0 2px 32px rgba(0, 0, 0, .5)
    }

    /* 오려 낸 인물(cut)을 제목 위에 겹쳐 글자가 인물 뒤로 지나가게 */
    .screen::after {
      z-index: 1
    }

    .screen img.cut {
      z-index: 3;
      pointer-events: none
    }

    /* Fight Club: 인물을 조금 작게·아래로 내려 머리가 igh 아래에 오게 */
    #f01 .screen {
      background: #05090b
    }

    /* 모든 화면에서 화면 너비 대비 비율을 똑같이: 2000px 화면 기준(제목 190px, 여백 32px, 제목 위 108px)을 vw로 고정 */
    /* 제목 크기·여백은 다른 네 편과 같은 규칙. 사진 크기·위치는 이 제목 크기(--u)에 맞춰 함께 변함 */
    #f01 .screen {
      --u: clamp(56px, 11vw, 190px);
      container-type: inline-size
    }

    /* 제목만 화면 폭에 가득 차게(인물 크기·위치는 --u 그대로), 두 인물은 오려 낸 레이어로 글자 앞에 */
    #f01 .screen h2 {
      font-size: calc((100cqw - 2 * var(--pad)) / 4.207); /* 스크롤바를 뺀 장면 실제 폭(cqw) 기준 */ /* Inter 500, 자간 -0.06em에서 'Fight Club' 잉크 폭 = 4.207em → 좌우 여백을 --pad로 똑같이 */
      letter-spacing: -.06em;
      left: calc(var(--pad) - .0806em); /* F 왼쪽 여백(0.0806em)만큼 당겨 잉크가 --pad에서 시작 */
      right: auto;
      top: 72px;
      white-space: nowrap
    }

    /* 글자 간격을 좁혀서 생기는 마지막 글자(b) 오른쪽 잘림 방지 */
    #f01 .screen h2 .m {
      padding-right: .45em;
      margin-right: -.45em
    }

    /* 원본 사진(2000x833)을 왼쪽 끝에 맞추고 71% 크기로: 타일러 머리카락이 igh 아랫부분에 걸치는 높이 */
    #f01 .screen img {
      top: calc(108px + .31 * var(--u)); /* 사진은 그대로, 제목만 올림 */
      height: calc(3.73 * var(--u));
      width: calc(3.73 * 2.401 * var(--u));
      object-position: 0% 50%
    }

    /* 작아진 사진의 위·오른쪽·아래 가장자리를 밤 배경으로 흐리게 이음 */
    #f01 .screen img:not(.cut) {
      -webkit-mask-image: linear-gradient(90deg, #000 78%, transparent), linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(90deg, #000 78%, transparent), linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent);
      mask-composite: intersect
    }

    /* 인물은 흐려지며 나타나지 않고 처음부터 100% 불투명하게 */
    #f01 .screen img {
      opacity: 1
    }


    /* Coyote Ugly: 제목을 왼쪽에 두 줄로 쌓아 가운데 오른쪽의 바이올렛 얼굴을 비우고, 어둠막은 왼쪽에만 */
    #f04 .screen h2 .w {
      display: block;
      width: max-content
    }

    /* 두 줄 제목이 서로 겹치지 않게 줄 간격, 대사는 제목과 같은 왼쪽 단 폭으로 */
    #f04 .screen h2 {
      line-height: 1.04
    }

    #f04 .screen h2 .m {
      padding-bottom: .42em;
      margin-bottom: -.42em
    }

    #f04 .screen .subt {
      max-width: min(28ch, 40%)
    }

    #f04 .screen::after {
      background: linear-gradient(90deg, rgba(0, 0, 0, .55), rgba(0, 0, 0, .15) 38%, transparent 52%), linear-gradient(180deg, transparent 55%, rgba(0, 0, 0, .5))
    }

    /* Notting Hill: AI로 위·왼쪽을 늘린 사진(1728x824). 원본 부분이 화면 높이의 80%가 되게 줄여 오른쪽 아래에 붙임 */
    #f05 .screen img {
      inset: auto 0 0 auto;
      height: calc(80% * 824 / 644);
      width: auto;
      min-width: 100%;
      object-fit: cover;
      object-position: 100% 100%
    }

    /* 팔레트 바탕: Fight Club만 장면처럼 검게, 나머지 네 편은 원래 흰 바탕 */
    #f01 .pal { --ink: #f2f0ed; --mute: #8d9192; --n100: #25292a; background: #0b0e0f; color: var(--ink); border-bottom: 0 }
    #f01 .pal .read i, #f01 .info dd .dot { border-color: rgba(255, 255, 255, .14) }
    /* 어두운 칩·AREA 막대가 묻히지 않게, 팔레트 전체 바탕이 가운데로 갈수록 아주 은은하게 밝아짐(위아래 끝은 팔레트 검정과 같음) */
    #f01 .pal {
      /* 오른쪽 위 모서리(DARK 칩 자리)에서 대각선으로 아주 살짝 밝은 빛 + 위아래 은은한 밝기 */
      background:
        linear-gradient(225deg, rgba(160, 175, 180, .17) 0%, rgba(160, 175, 180, .08) 24%, rgba(160, 175, 180, 0) 50%),
        linear-gradient(180deg, #0b0e0f 0%, #121618 18%, #131719 45%, #111416 72%, #0b0e0f 100%)
    }

    /* AREA 막대 뒤에도 같은 결의 은은한 빛: 막대 위아래로 퍼졌다 사라지는 직선형 */
    #f01 .pal .area {
      position: relative;
      z-index: 0
    }

    #f01 .pal .area::before {
      content: "";
      position: absolute;
      left: -15%;
      right: -15%;
      top: -180px;
      bottom: -180px;
      z-index: -1;
      pointer-events: none;
      /* 막대 띠가 아니라 넓은 원으로 번지는 빛(오른쪽 위 모서리 빛과 같은 결) */
      background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(160, 175, 180, .13) 0%, rgba(160, 175, 180, .06) 45%, rgba(160, 175, 180, 0) 100%)
    }

    /* 모바일: 칩 줄이 세로로 쌓이므로 MEDIUM·DARK 칩 뒤에 위아래로 은은하게 퍼지는 빛 */
    @media (max-width:900px) {
      #f01 .pal .tg {
        position: relative;
        z-index: 0
      }

      #f01 .pal .tg::before {
        content: "";
        position: absolute;
        left: calc(-1 * var(--pad));
        right: calc(-1 * var(--pad));
        top: 28%;
        bottom: -24px;
        z-index: -1;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(160, 175, 180, 0), rgba(160, 175, 180, .12) 35%, rgba(160, 175, 180, .12) 70%, rgba(160, 175, 180, 0))
      }

      #f01 .pal .area::before {
        left: calc(-1 * var(--pad));
        right: calc(-1 * var(--pad));
        top: -140px;
        bottom: -140px;
        /* 모바일만: 막대 앞부분에도 빛 */
        background: radial-gradient(ellipse 40% 50% at 22% 50%, rgba(160, 175, 180, .12) 0%, rgba(160, 175, 180, .05) 45%, rgba(160, 175, 180, 0) 100%), radial-gradient(ellipse 50% 50% at 55% 50%, rgba(160, 175, 180, .13) 0%, rgba(160, 175, 180, .06) 45%, rgba(160, 175, 180, 0) 100%)
      }
    }

    /* 왼쪽 정보 칸과 오른쪽 색 영역이 한 바탕으로 이어지게(가운데 세로 경계선 없앰) */
    #f01 .pal .l {
      border-right-color: transparent
    }

    /* Fight Club 영역과 아래 조명 띠 사이 1px 틈도 같은 검정으로 */
    #f01 { background: #0b0e0f }

    /* Fight Club → Whiplash: 아래로 갈수록 Whiplash의 금빛으로 데워지는 직선형 전환 (Whiplash 장면에는 아무것도 얹지 않음) */
    /* 무대 조명 층: 가운데가 밝고 양옆이 어두운 연한 금빛, 아래로 갈수록 밝음. 밝기는 스크롤 진행(--glow 0→1)에 따라 */
    #f01 {
      position: relative
    }

    #f01::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: clamp(320px, 60vh, 620px);
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(11, 14, 15, .8), rgba(11, 14, 15, 0) 32%, rgba(11, 14, 15, 0) 68%, rgba(11, 14, 15, .8)),
        linear-gradient(180deg, rgba(229, 187, 95, 0) 0%, rgba(229, 187, 95, .04) 35%, rgba(229, 187, 95, .13) 70%, rgba(229, 187, 95, .22) 90%, rgba(229, 187, 95, .26) 100%);
      opacity: var(--glow, 0);
      transition: opacity .08s linear
    }

    #f01::after {
      content: "";
      display: block;
      margin-top: -1px;
      /* 경계는 또렷하게 두고, 띠 안에서만 뒤쪽 아래에서 금빛 조명이 올라오듯 직선형으로 밝아짐 */
      height: clamp(320px, 60vh, 620px);
      /* 바탕은 어둠만. 조명은 아래 #f01::before 층이 스크롤에 따라 서서히 켜짐. 경계는 딱 끊김 */
      background: #0b0e0f
    }


    /* Notting Hill: 인물마다 한 줄씩 들어가도록 대사 칸을 넓게 */
    #f05 .screen .subt {
      max-width: min(64ch, 68%)
    }

    /* 표지의 우리말 대사는 칸 폭과 상관없이 한 줄 */
    .screen .subt small {
      white-space: nowrap
    }

    /* 모바일(좁은 화면)에서는 잘리지 않게 우리말 대사도 줄바꿈 허용 */
    @media (max-width:900px) {
      .screen .subt small {
        white-space: normal;
        word-break: keep-all
      }
    }

    .film .screen .lab,
    .film .screen .yr,
    .film .screen .subt {
      z-index: 4
    }

    .screen h2 .m {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
      /* 그림자(text-shadow)가 잘리지 않게 사방으로 여유. 같은 양을 음수 margin으로 빼서 글자 위치는 그대로 */
      padding: .3em .35em .4em;
      margin: -.3em -.35em -.34em
    }

    .screen h2 .w {
      display: inline-block;
      transform: translateY(150%);
      transition: transform 1.3s var(--expo)
    }

    .film.in .screen h2 .w {
      transform: none
    }

    .screen .yr {
      position: absolute;
      right: var(--pad);
      bottom: calc(var(--pad) * 1.2);
      z-index: 2;
      font: 500 clamp(48px, 9vw, 150px)/.8 var(--sans);
      letter-spacing: -.06em;
      opacity: 0;
      transition: opacity 1s .8s
    }

    .film.in .screen .yr {
      opacity: 1
    }

    .screen .subt {
      position: absolute;
      left: var(--pad);
      bottom: calc(var(--pad) * 1.2);
      z-index: 2;
      max-width: min(46ch, 52%);
      font: 500 clamp(16px, 1.7vw, 26px)/1.35 var(--sans);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1s .9s, transform 1.2s .9s var(--expo)
    }

    .screen .subt small {
      display: block;
      font: 400 clamp(13px, 1.1vw, 16px)/1.35 var(--sans);
      margin-top: 6px;
      opacity: .9
    }

    .screen .subt .by {
      display: block;
      margin-top: 9px;
      opacity: .75
    }

    .film.in .screen .subt {
      opacity: 1;
      transform: none
    }

    .screen .miss {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--mute)
    }

    .film.nostill .screen .miss {
      display: flex
    }

    .film.nostill .screen img {
      display: none
    }

    .pal {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) 2.2fr;
      border-bottom: 1px solid var(--n100)
    }

    .pal .l {
      padding: calc(var(--pad) + 20px) var(--pad) var(--pad);
      border-right: 1px solid var(--n100)
    }

    .info {
      margin: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      border-top: 1px solid var(--ink)
    }

    .info dt,
    .info dd {
      margin: 0;
      padding: 10px 0;
      border-bottom: 1px solid var(--n100);
      display: flex;
      align-items: center;
      min-height: 40px
    }

    .info dt {
      color: var(--ink);
      font-weight: 700;
      padding-right: 22px
    }

    .info dd {
      font: 500 15px/1.25 var(--sans);
      justify-content: flex-end;
      text-align: right
    }

    .info dd .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 0;
      margin-right: 8px;
      flex: none;
      border: 1px solid rgba(0, 0, 0, .12)
    }

    .pal .r {
      padding: calc(var(--pad) + 20px) var(--pad) var(--pad)
    }

    .tonebox {
      padding: 0
    }

    .tg {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(14px, 2.4vw, 36px)
    }

    .tg .mono,
    .sp2 .mono,
    .pts>.mono,
    .area-t,
    .say .k {
      display: block;
      margin-bottom: 12px;
      font: 700 10px/1 var(--sans);
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--ink)

    .tg .mono em,
    .sp2 .mono em {
      font-style: normal;
      color: var(--mute)
    }

    .sws {

      height: clamp(46px, 5vw, 72px)
    }

    .sws button {

      position: relative;

      transform-origin: 50% 100%;
      opacity: 0;
      transition: transform .9s var(--expo), opacity .4s
    }

    .film.in .sws button {
      transform: none;
      opacity: 1
    }

    .sws button:hover {
      transform: scaleY(1.12);
      z-index: 2
    }

    .sp2 {
      margin-top: clamp(18px, 2.4vw, 34px)
    }

    .sp2 .sws {
      height: clamp(52px, 5.6vw, 84px)
    }

    .read {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      min-height: 22px;
      color: var(--mute)
    }

      height: 22px;
      border: 1px solid rgba(0, 0, 0, .1)

    .read b {

      color: var(--ink);
      letter-spacing: 0
    }

    .pts {
      display: flex;
      flex-wrap: wrap;
      column-gap: 2px;
      row-gap: 0;
      width: calc((100% - 2 * clamp(14px, 2.4vw, 36px)) / 3);
      margin-top: calc(var(--pad) * 1.2)

    .pts>.mono {
      width: 100%
    }

    .pts button {
      flex: 1 1 0;
      min-width: 0;
      text-align: left
    }

    .pts span {
      display: block;
      aspect-ratio: 1.9;
      border-radius: 0;
      transform: scale(.6);
      opacity: 0;
      transition: transform .9s .4s var(--expo), opacity .5s .4s
    }

    .film.in .pts span {
      transform: none;
      opacity: 1
    }

    .pts b {
      display: block;
      margin-top: 8px;
      font: 500 14px/1 var(--sans)
    }

    .pts small {
      display: block;
      margin-top: 4px;
      color: var(--mute)
    }

    .area {
      display: flex;
      height: 10px;
      margin-top: calc(var(--pad) * 1.2)
    }

    .area i {
      height: 100%;
      width: 0;
      transition: width 1.4s var(--expo)
    }

    .film.in .area i {
      width: var(--w)
    }

    .say {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--pad);
      margin-top: calc(var(--pad) * 1.3);

    .acts {

    footer {
      background: #000;

      justify-content: space-between;
      gap: 20px;
      padding: 18px var(--pad);
      border-top: 1px solid #222

    .lb {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(252, 251, 250, .98);
      display: none;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
      gap: 4vw;
      align-items: center;
      padding: 5vh 5vw
    }

    .lb.open {
      display: grid;
      animation: fade .25s ease
    }

    @keyframes fade {
      from {
        opacity: 0
      }
    }

    .lb img {

      max-width: 100%;

      margin-top: 12px;

    }

    }

      transform: none
    }

      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .4s var(--expo);

      transform: translate(-50%, 0)

  <script>
    (() => {
      const D = JSON.parse(document.getElementById('cinema').textContent);
      const F = (D.films || []).slice(0, 5);
      // 위플래쉬를 첫 번째로(1 · 2번 자리 바꿈)
      F.forEach(f => { f.key = f.no; }); [F[0], F[1]] = [F[1], F[0]]; F.forEach((f, i) => { f.no = '0' + (i + 1); }); // key: 영화별 디자인(#f01…)은 원래 번호를 따른다
      // 극장 페이지로 열면 장면 원본, 갤러리 안(?embed=1)에서는 그라데이션
      if (!document.documentElement.classList.contains('emb')) F.forEach(f => { if (f.still) f.still = f.still.replace(/\.png$/, '.jpg'); if (f.cut) f.cut = f.cut.replace('01_cut.png', '01_cut_photo.png'); });
      const $ = id => document.getElementById(id);
      const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const br = s => esc(s).replace(/\\n|\n/g, '<br>');
      const pc = (p, d) => (+p * 100).toFixed(d) + '%';
      const pad2 = n => String(n).padStart(2, '0');
      const nm = f => f.title || ('Film ' + f.no);
      const NOW = new Date().getFullYear();
      const dash = v => v || '—';

      // 색 도우미
      const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
      const lum = h => { const [r, g, b] = rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
      const inkOn = h => lum(h) > .36 ? '#0e0e0d' : '#ffffff';
      const sat = h => { const [r, g, b] = rgb(h).map(v => v / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b); return mx ? (mx - mn) / mx : 0; };
      const pt = f => f.point || ((f.accent || [])[0] || {}).hex || ((f.main || []).slice().sort((a, b) => sat(b.hex) - sat(a.hex))[0] || {}).hex || '#fcaa37';
      // tone이 없으면 main · accent로 대신 그린다
      const tone = f => {
        if (f.tone && f.tone.spectrum && f.tone.spectrum.length) return f.tone;
        const all = (f.main || []).concat(f.accent || []).slice().sort((a, b) => lum(b.hex) - lum(a.hex));
        const n = Math.max(1, Math.ceil(all.length / 3));
        return { light: all.slice(0, n).reverse(), medium: all.slice(n, 2 * n), dark: all.slice(2 * n).reverse(), spectrum: all };
      };
      const spec = (arr, cls) => `<div class="${cls}">${arr.map(c => `<i style="background:${esc(c.hex)}"></i>`).join('')}</div>`;
      const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1600); };

      // 머리
      const years = F.map(f => +f.year).filter(Boolean);
      document.title = (D.title || '극장').replace(/\n/g, ' ');
      $('mark').textContent = (D.name || D.author || '') ? (D.name || D.author) + '의 Cinema' : 'Cinema';
      $('gnb').innerHTML = F.map(f => `<a href="#f${esc(f.key || f.no)}">${esc(f.titleEn || nm(f))}</a>`).join('');
      $('cnt').textContent = pad2(F.length) + ' films';
      $('yrs').textContent = years.length ? Math.min(...years) + '–' + Math.max(...years) : '';

      // ── 첫 화면: 흰 패널이 걷히며 장면 다섯 칸이 열린다 ──
      const hero = $('top');
      const words = t => esc(t).split(/\\n|\n/).map(line => `<span class="m">${line.split(/(\s+)/).filter(w => w.trim()).map(w => `<span class="w">${w}</span>`).join(' ')}</span>`).join('');
      const chars = (t, step, d0) => esc(t).split('').map((c, i) => `<i style="transition-delay:${(d0 + i * step).toFixed(2)}s">${c === ' ' ? '&nbsp;' : c}</i>`).join('');
      const bigT = String(D.title || '').replace(/\\n|\n/g, ' ');
      $('htxt').innerHTML = `<span class="hsm">${chars(bigT, .05, .5)}</span><h1 class="hbig">${chars(D.subtitle || '', .1, 0)}</h1>`;
      // 영화 다섯 편이 차례로: 장면이 바뀌고, 그 영화의 컬러칩 네 장이 왼쪽에서 들어왔다 오른쪽으로 나간다
      const EMB = document.documentElement.classList.contains('emb');
      const NF = F.length, P1 = EMB ? 0 : 1.1, SEG = 1.0;
      $('himgs').innerHTML = `${F.map((f, i) => `<div class="hscene" data-i="${i}"><img src="${esc(f.still)}" alt="${esc(nm(f))} 장면" onerror="this.remove()"></div>`).join('')}
  <div class="hchips" id="hchips">${['Light', 'Medium', 'Dark', 'Point'].map(k => `<div class="hchip" data-hex="" title="누르면 복사"><b>${k}</b><span></span></div>`).join('')}</div>
  <div class="hcap" id="hcap"></div><p class="hq" id="hq"></p>
  <div class="hcnt" id="hcnt"></div>
  <div class="hnav" id="hnav">${F.map((f, i) => `<button data-i="${i}" aria-label="${esc(f.no)} ${esc(nm(f))}">${esc(f.no)}</button>`).join('')}</div>`;
      const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
      if (still) hero.classList.add('static');
      const imgs = $('himgs'), htop = $('htop'), htxt = $('htxt'), hcap = $('hcap'), hq = $('hq');
      const chips = [...document.querySelectorAll('.hchip')], scenes = [...document.querySelectorAll('.hscene')], navb = [...document.querySelectorAll('#hnav button')];
      const midc = (a, d) => a[Math.floor(a.length / 2)] || { hex: d };
      let shown = -1;
      function setFilm(i) {
        if (i === shown) return; shown = i;
        const f = F[i], T = tone(f), p = pt(f);
        const cs = [midc(T.light, p), midc(T.medium, p), midc(T.dark, p), { hex: p }];
        chips.forEach((c, k) => { const h = cs[k].hex; c.dataset.hex = h; c.style.background = h; c.style.color = inkOn(h); c.title = h + ' · 누르면 복사'; c.querySelector('span').textContent = h.toUpperCase(); });
        hcap.innerHTML = `<b>${esc(nm(f))}</b>${esc(dash(f.year))} · ${esc(dash(f.director))}${EMB ? '' : `<br>${esc(f.no)} / ${pad2(NF)}`}`; $('hcnt').textContent = f.no + ' / ' + pad2(NF);
        const q = f.quote && f.quote.text ? f.quote : null;
        hq.innerHTML = q ? `${br(q.text)}${q.tr ? `<small>${br(q.tr)}</small>` : ''}` : '';
        scenes.forEach((e, k) => e.classList.toggle('on', k === i));
        navb.forEach((e, k) => e.setAttribute('aria-current', k === i ? 'true' : 'false'));
      }
      setFilm(0);
      $('hnav').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const H = innerHeight, top = hero.getBoundingClientRect().top + scrollY; window.scrollTo({ top: top + (P1 + (+b.dataset.i + .55) * SEG) * H, behavior: 'smooth' }); });
      const ease3 = q => 1 - Math.pow(1 - q, 3), clamp01 = q => Math.min(1, Math.max(0, q));
      let VS = 0;
      function scrub() {
        if (still) return;
        const r = hero.getBoundingClientRect(), H = innerHeight, sc = EMB ? VS : -r.top;
        const p = P1 ? clamp01(sc / (H * P1)) : 1;
        htxt.style.transform = `translate3d(0,${(-50 * p * p).toFixed(2)}%,0)`;
        htop.style.transform = `translate3d(0,${(-100 * p * p).toFixed(2)}%,0)`;
        const out = 1 - (1 - p) * (1 - p);
        imgs.style.transform = `translate3d(0,${(30 * (1 - out)).toFixed(2)}%,0) scale(${(1.25 - .25 * p).toFixed(4)})`;
