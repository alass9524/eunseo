  /* 포인터 원이 글자를 통과: 본문 글자를 원(z-index 300)보다 위 층에 둔다 */
  h1#def, .by, .hint, .eyebrow, .c dl, .go { position: relative; z-index: 301; }

  /* 링크(그 주 작업 보기 →) 위: GNB와 같은 속이 찬 파란 원으로 커짐. 글자는 원 위에 보임 */
  .fx-cur.link { background: #2747b5 !important; border: 0 !important; width: 44px; height: 44px; opacity: 1 !important; }

  /* 로고(Sample Archive): GNB 우측 메뉴와 같은 서체 — 11px · 600 · 대문자 · 자간 .06em (모든 페이지 통일) */

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fail = (m) => { $("error").hidden = false; $("error").textContent = m; };
  const G = window.GALLERY;
  if (!G || !Array.isArray(G.cards)) { fail("data.js를 읽지 못했습니다. data.js가 index.html과 같은 폴더에 있는지, 쉼표 · 따옴표 · 괄호가 맞는지 확인하세요. 안 풀리면 data_첫판.js와 비교하세요."); return; }
  const TOPIC = {"4": "시선", "5": "사람", "6": "공간", "7": "물건", "9": "문장", "10": "음악", "11": "영화"};
  const EN = {"4": "Gaze", "5": "People", "6": "Space", "7": "Objects", "9": "Words", "10": "Music", "11": "Film"};
  const pad = (w) => String(w ?? "").padStart(2, "0");
  const safe = (h) => (h && !/^\s*(javascript|data|vbscript):/i.test(String(h))) ? String(h) : "";
  const ALLOWED = [4, 5, 6, 7, 9, 10, 11];
  const OBJECTS = ["bellows", "blinds", "bookshelf", "dial", "dominoes", "drawers", "gears", "hourglass", "keys", "lamp", "metronome", "pins", "ribbon", "riffle", "scale", "spring", "stairs", "terrain", "tower", "turnstile", "valves", "windmill"];
  const NAME_OK = /^[a-z][a-z0-9-]*$/;
  const probs = [];
  if (G.cards.length !== 7) probs.push("카드는 7장이어야 합니다(지금 " + G.cards.length + "장).");
  const seen = new Set();
  G.cards.forEach((c, i) => {
    const n = i + 1;
    if (!c || c.week == null) { probs.push(n + "번째 카드에 week가 없습니다."); return; }
    if (!ALLOWED.includes(Number(c.week))) probs.push(n + "번째 카드의 week " + c.week + "는 쓸 수 없습니다(4 · 5 · 6 · 7 · 9 · 10 · 11 중 하나).");
    if (seen.has(Number(c.week))) probs.push(n + "번째 카드의 week " + c.week + "가 앞 카드와 같습니다.");
    seen.add(Number(c.week));
    if (!NAME_OK.test(String(c.object))) probs.push(n + "번째 카드의 object 「" + c.object + "」는 쓸 수 없는 이름입니다(영문 소문자 · 숫자 · 하이픈만 쓰고, objects 안 hairline-이름.html의 이름과 같아야 합니다).");
  });
  if (probs.length) fail("data.js를 확인하세요. " + probs.join(" "));
  const cards = G.cards.slice(0, 7).filter((c) => c && c.week != null && ALLOWED.includes(Number(c.week)));
  $("def").textContent = String(G.definition || "");
  $("by").textContent = G.author ? String(G.author) : "";
  document.title = "cue, 장은서의 취향 갤러리";
  const BLUE = { plate: "#ffffff", hi: "#2747b5", edge: "#4a67c4", mid: "#8ea0dc", lo: "#cfd7f3" };
  const colorQuery = (c) => {
    if (!c || typeof c !== "object") return "";
    const ok = {};
    ["plate", "hi", "edge", "mid", "lo"].forEach((k) => { if (typeof c[k] === "string" && /^#[0-9a-fA-F]{3,8}$/.test(c[k])) ok[k] = c[k]; });
    const sw = Number(c.stroke); if (Number.isFinite(sw) && sw >= 0.5 && sw <= 2.5) ok.stroke = sw;
    return Object.keys(ok).length ? "&color=" + encodeURIComponent(JSON.stringify(ok)) : "";
  };
  const frames = [];
  cards.forEach((c) => {
    const obj = NAME_OK.test(String(c.object)) ? c.object : "terrain";
    const href = safe(c.href) || "weeks/week-" + pad(c.week) + ".html";
    const art = document.createElement("article"); art.className = "c";
    const fr = document.createElement("div"); fr.className = "frame";
    const ifr = document.createElement("iframe");
    ifr.src = "objects/hairline-" + obj + ".html?embed=1&week=" + encodeURIComponent(c.week) + colorQuery(Object.assign({}, BLUE, (c.color && typeof c.color === "object") ? c.color : {}));
    ifr.title = (TOPIC[c.week] || "") + " 오브젝트"; ifr.dataset.href = href;
    fr.appendChild(ifr); art.appendChild(fr); frames.push(ifr);
    const eb = document.createElement("p"); eb.className = "eyebrow"; eb.textContent = pad(c.week) + " " + (EN[String(c.week)] || ""); art.appendChild(eb);
    const h = document.createElement("h2"); h.textContent = String(c.nameEn || c.name || ""); art.appendChild(h);
    const dl = document.createElement("dl");
    [["Content", c.what], ["Intent", c.why], ["Standard", c.line]].forEach(([k, v]) => { if (!v) return; const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k; dd.textContent = String(v); dl.append(dt, dd); });
    art.appendChild(dl);
    const a = document.createElement("a"); a.className = "go"; a.href = href; a.textContent = "그 주 작업 보기 →"; art.appendChild(a);
    $("grid").appendChild(art);
  });
  addEventListener("message", (e) => {
    const d = e.data, ifr = frames.find((f) => f.contentWindow === e.source);
    if (ifr && d && d.gallery === "go") location.href = ifr.dataset.href;
  });
  const root = document.documentElement;
  const dark = () => (root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
  $("theme").addEventListener("click", () => { const t = dark() ? "light" : "dark"; root.dataset.theme = t; frames.forEach((f) => { try { f.contentWindow.postMessage({ theme: t }, "*"); } catch (_) {} }); });
})();
</script>
