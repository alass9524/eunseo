  :root[data-theme="dark"] { color-scheme: dark; --ground: #08090a; --ink: #d0d6e0; --muted: #8a8c95; --line: #29292d; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--ground); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 640px; }
  .plate { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .tag, .label, output, button { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.02em; }
  .tag { position: absolute; top: 12px; z-index: 1; color: var(--muted); pointer-events: none; }
  #name { left: 14px; }
  #read { right: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 14px; }
  .label { color: var(--muted); }
  input[type="range"] {
    flex: 1 1 96px; min-width: 0; height: 32px; margin: 0; background: transparent; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--muted); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%;
    border: 1px solid var(--ink); background: var(--ground);
  }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--muted); }
  input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ground); }
  input[type="range"]:focus-visible, button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  output { min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
  button {
    height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--ink); cursor: pointer;
  }
  #play[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  #means { margin: 14px 0 0; text-wrap: pretty; }
  #rules { margin: 6px 0 0; line-height: 1.6; }
  #error { margin: 12px 0 0; padding-left: 10px; border-left: 1px solid var(--ink); }
</style>
</head>
<body>
<main>
  <div class="plate">
    <span class="tag" id="name"></span>
    <span class="tag" id="read"></span>
    <div id="stage"></div>
  </div>
  <div class="controls">
    <label class="label" for="intensity">intensity</label>
    <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.5">
    <output id="value" for="intensity"></output>
    <span class="label">theme</span>
    <button id="theme" type="button" aria-label="Switch between the light and the dark theme"></button>
    <span class="label">play</span>
    <button id="play" type="button" aria-pressed="false">play</button>
  </div>
  <p id="means"></p>
  <p id="rules" class="label"></p>
  <p id="error" role="alert" hidden></p>
</main>

  const sky = mk("path", { class: "nf sil", d: poly(disc(CR, CZ + 6, 56)) }, lamp);
  can(2.2, CZ + 18, 3.4, CZ + 8); can(4.4, CZ + 6, 2.4, CZ - 2); can(2, CZ - 3, 0.8, CZ - 7);
  arms.slice(3).forEach(arm);
  const win = [frames[0], sky, frames[1]];
  const part = (c) => mk("path", { class: c }, man);
  const E = { fl: part("sil"), fl2: part("fo"), nl: part("sil"), nl2: part("fo"), fa: part("sil"), fa2: part("fo"), body: part("sil"), na: part("sil"), na2: part("fo"), head: part("sil"), hair: part("nf lo") };

  const from = [1, 0, 0].map((v, i) => tween(i === 1 ? 1 : 0)), lit = tween(0), tw = J.map((_, i) => POSES[3].j[i].map((v) => tween(v))), yawT = tween(POSES[3].yaw);
  let drawn = "";

  const ball = (p, r, n = 16) => { const c = P(...p), R = r * C.S; return Array.from({ length: n }, (_, k) => [c[0] + R * Math.cos((k / n) * 6.2832), c[1] + R * Math.sin((k / n) * 6.2832)]); };
  // a bent limb: two tapers, drawn once as an outline and once more as a fill a hair smaller, so no joint shows
  const limb = (el, el2, a, b, c, r0, r1, r2) => {
    const pair = (d) => poly(hull([...ball(a, r0 - d), ...ball(b, r1 - d)])) + poly(hull([...ball(b, r1 - d), ...ball(c, r2 - d)]));
    el.setAttribute("d", pair(0)); el2.setAttribute("d", pair(0.4));
  };

  function drawMan(now) {
    const yaw = tval(yawT, now), f = [Math.cos(yaw), Math.sin(yaw)], s = [-f[1], f[0]], p = {};
    J.forEach((n, i) => { const [a, b, c] = tw[i].map((t) => tval(t, now)); p[n] = [PX + s[0] * a + f[0] * b, PY + s[1] * a + f[1] * b, c]; });
    const near = s[0] + s[1] > 0 ? "r" : "l", far = near === "r" ? "l" : "r";
    for (const [k, q] of [["f", far], ["n", near]]) {
      const hp = [p.hip[0] + s[0] * (q === "r" ? 4 : -4), p.hip[1] + s[1] * (q === "r" ? 4 : -4), p.hip[2] + 1];
      limb(E[k + "l"], E[k + "l2"], hp, p[q + "kn"], p[q + "fo"], 4.4, 3.5, 2.6);
      limb(E[k + "a"], E[k + "a2"], p[q + "sh"], p[q + "el"], p[q + "ha"], 2.9, 2.5, 2.1);
    }
    const neck = p.chest.map((v, i) => lerp(v, p.head[i], 0.42));
    E.body.setAttribute("d", poly(hull([...ball([p.hip[0] - s[0] * 3.4, p.hip[1] - s[1] * 3.4, p.hip[2] + 1], 4.6), ...ball([p.hip[0] + s[0] * 3.4, p.hip[1] + s[1] * 3.4, p.hip[2] + 1], 4.6), ...ball(p.lsh, 3), ...ball(p.rsh, 3), ...ball(neck, 2.6)])));
    E.head.setAttribute("d", poly(ball(p.head, 6.2, 24)));
    // the hairline: a chord across the back of the head, away from where they face
    const v = [p.head[0] - p.chest[0], p.head[1] - p.chest[1], p.head[2] - p.chest[2]], l = Math.hypot(...v) || 1, up = v.map((q) => q / l), c0 = P(...p.head);
    const tip = P(p.head[0] + up[0] * 2 - f[0] * 1.5, p.head[1] + up[1] * 2 - f[1] * 1.5, p.head[2] + up[2] * 2), dx = tip[0] - c0[0], dy = tip[1] - c0[1], m = Math.hypot(dx, dy) || 1, nx = -dy / m, ny = dx / m, R = 6.2 * C.S, half = Math.sqrt(Math.max(0, R * R - m * m)) * 0.98, pts = [];
    for (let k = 0; k <= 10; k++) { const t = k / 5 - 1, bow = (1 - t * t) * 2.4; pts.push([tip[0] + nx * half * t - (dx / m) * bow, tip[1] + ny * half * t - (dy / m) * bow]); }
    E.hair.setAttribute("d", open(pts));
    // folded up, the near arm and knees come before the face; upright, the head is in front
    const low = p.hip[2] < 18, seq = low ? ["body", "fl", "fl2", "head", "hair", "nl", "nl2", "fa", "fa2", "na", "na2"] : ["fl", "fl2", "nl", "nl2", "fa", "fa2", "body", "na", "na2", "head", "hair"];
    seq.forEach((k) => man.append(E[k]));
  }
  // each light is eight points: four corners it leaves, four corners it lands on, round the person
  const lands = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  const LIGHTS = [
    { top: [[0, A0 + 3, Z1 - 3], [0, A1 - 3, Z1 - 3]], foot: lands(26, 50, PX + 22, 84), ends: [1, 2] },
    { top: [[PX - CR * 0.707, PY + CR * 0.707, CZ + 4], [PX + CR * 0.707, PY - CR * 0.707, CZ + 4]], foot: lands(PX - 24, PY - 24, PX + 24, PY + 24), ends: null },
    { top: [[A0 + 3, 0, Z1 - 3], [A1 - 3, 0, Z1 - 3]], foot: lands(50, 26, 84, PY + 22), ends: [3, 2] },
  ];
  function drawLight(now, o) {
    if (o < 0.02) { patch.setAttribute("d", ""); rays.setAttribute("d", ""); return; }
    const w = from.map((f) => tval(f, now)), mix = (f) => [0, 1, 2].reduce((s, i) => s + w[i] * f(LIGHTS[i]), 0);
    const foot = [0, 1, 2, 3].map((k) => [mix((l) => l.foot[k][0]), mix((l) => l.foot[k][1])]), cx = (foot[0][0] + foot[2][0]) / 2, cy = (foot[0][1] + foot[2][1]) / 2;
    const at = foot.map(([x, y]) => P(lerp(cx, x, o), lerp(cy, y, o), 0));
    const rr = lerp(4, 40, w[1]), edge = fillet(at, [rr, rr, rr, rr], 10), far = [0, 1].map((k) => edge.reduce((m, p) => ((k ? p[0] > m[0] : p[0] < m[0]) ? p : m)));
    patch.setAttribute("d", poly(edge));
    const best = w.indexOf(Math.max(...w)), l = LIGHTS[best];
    rays.setAttribute("d", w[best] > 0.9 ? l.top.map((p, k) => { const a = P(...p), b = l.ends ? at[l.ends[k]] : far[k]; return seg(a, [lerp(a[0], b[0], o), lerp(a[1], b[1], o)]); }).join("") : "");
  }

  const B = register(stage, (_dt, now) => {
    const o = tval(lit, now), key = from.map((f) => tval(f, now).toFixed(3)).join() + o.toFixed(3) + tval(yawT, now).toFixed(3) + tw.map((t) => t.map((q) => tval(q, now).toFixed(2)).join()).join();
    if (key !== drawn) { drawn = key; drawLight(now, o); drawMan(now); }
    return from.some((f) => !tdone(f, now)) || !tdone(lit, now) || !tdone(yawT, now) || tw.some((t) => t.some((q) => !tdone(q, now)));
  });
  bag.add(B.unregister);

  // the stage never moves: its left, its middle (where the person stands) and its right are the three lights
  const part3 = (x) => (x < 168 ? 0 : x < 238 ? 1 : 2);
  function setActive(a) {
    if (a === act) return;
    const now = performance.now(), k = a < 0 ? 3 : a;
    act = a;
    from.forEach((f, i) => { if (a >= 0) tset(f, i === a ? 1 : 0, now, 0); }); tset(lit, a < 0 ? 0 : 1, now, 0); tset(yawT, POSES[k].yaw, now, 0);
    J.forEach((_, i) => tw[i].forEach((t, m) => tset(t, POSES[k].j[i][m], now, ORDER[i] * stag)));
    win.forEach((el, i) => el.classList.toggle("hi", i === (a < 0 ? 1 : a)));
    read.textContent = a < 0 ? "rest" : "light " + (a + 1);
    B.wake();
  }
  win[1].classList.add("hi");
  bag.add(pointer(stage, {
    move: (p) => setActive(part3(p[0])),
    leave: () => setActive(-1),
  }));
  bag.add(() => svg.replaceChildren());

  return { set: (v) => { stag = v; }, destroy: bag.dispose };
}

hairline({
  name: "windowlight",
  means: "One person, three lights, left, above and right: each one makes them someone else, folded, flung open or at ease.",
  rules: [1, 2, 4, 8],
  range: [0, 30, 70],
  tour: [[120, 170], [200, 190], [280, 190], null],
  mount,
});
</script>
<script id="gallery-embed">
/* 갤러리 안에 넣을 때(?embed=1)만 동작: 조작 UI를 숨기고, 누르면 부모 페이지에 주차 이동을 알린다. 평소에는 아무 일도 하지 않는다. */
(() => {
  const q = new URLSearchParams(location.search);
  if (!q.get("embed")) return;
  try {
    const col = JSON.parse(q.get("color") || "{}");
    ["plate", "hi", "edge", "mid", "lo"].forEach((k) => { if (typeof col[k] === "string" && /^#[0-9a-fA-F]{3,8}$/.test(col[k])) document.documentElement.style.setProperty("--hairline-" + k, col[k]); });
    const sw = Number(col.stroke); if (Number.isFinite(sw) && sw >= 0.5 && sw <= 2.5) document.documentElement.style.setProperty("--hairline-stroke", String(sw));
  } catch (_) {}
  const st = document.createElement("style");
  st.textContent = "html,body{overflow:hidden}body{display:block;min-height:0;padding:0}main{max-width:none}.plate{border:0;border-radius:0}.controls,#means,#rules,#name,#read{display:none!important}";
  document.head.appendChild(st);
  const stage = document.getElementById("stage");
  stage.style.cursor = "pointer";
  let armed = false, timer = 0, kind = "mouse";
  stage.addEventListener("pointerdown", (e) => { kind = e.pointerType; }, true);
  stage.addEventListener("click", () => {
    if (kind !== "mouse" && !armed) { armed = true; clearTimeout(timer); timer = setTimeout(() => { armed = false; }, 3000); return; }
    parent.postMessage({ gallery: "go", week: Number(q.get("week")) }, "*");
  });
  addEventListener("message", (e) => { if (e.data && (e.data.theme === "light" || e.data.theme === "dark")) document.documentElement.dataset.theme = e.data.theme; });
})();
</script>
